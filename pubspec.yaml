name: countdown_todo
description: A new Flutter project.
publish_to: 'none'
version: 6.6.35
environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^2.0.0

  home_widget: ^0.10.0
  shared_preferences: ^2.5.5
  # Keep v10 while users can upgrade directly from a public 9.x build: its
  # Android migration reads legacy ciphers that v11 removes.
  flutter_secure_storage: ^10.3.1
  intl: ^0.20.2
  http: ^1.2.0
  package_info_plus: ^10.2.1
  url_launcher: ^6.2.4
  flutter_downloader: ^1.12.0
  path_provider: ^2.1.2
  path: ^1.9.0
  permission_handler: ^13.0.2
  uuid: ^4.2.2
  cached_network_image: ^4.0.2
  flutter_cache_manager: ^3.4.1
  window_manager: ^0.5.0
  desktop_multi_window: ^0.3.0
  ffi: ^2.1.2
  win32: ^6.4.0
  flutter_local_notifications: ^22.3.1
  open_file: ^4.0.0
  device_info_plus: ^13.2.0
  file_picker: ^13.1.0
  receive_sharing_intent: ^1.8.1
  share_plus: ^13.3.0
  html: ^0.15.4
  web_socket_channel: ^3.0.1
  sqflite: ^2.4.3
  sqflite_common_ffi: ^2.3.0   # 桌面端 SQLite 读取
  sqflite_common_ffi_web: ^1.1.2
  web: ^1.1.1
  video_player: ^2.11.1
  video_player_win: ^3.2.2
  flutter_image_compress: ^2.3.0
  flutter_markdown_plus: ^1.0.12
  encrypt: ^5.0.3
  crypto: ^3.0.3
  pointycastle: ^3.9.1
# Local fork keeps the upstream API while migrating its Windows registry access
# to win32_registry 3 for the Win32 6 dependency chain.
  launch_at_startup:
    path: third_party/launch_at_startup
  tray_manager: ^0.7.0
  webview_flutter: ^4.13.1
  webview_flutter_android: ^4.11.0
  webview_flutter_wkwebview: ^3.24.3
  webview_win_floating: ^3.0.2
  visibility_detector: ^0.4.0+2
  timezone: ^0.11.1
  qr_flutter: ^4.1.0
  dynamic_color: ^2.1.0
  material_ui: ^1.5.0
  sensors_plus: ^7.1.0
  image_picker: ^1.2.2
  image_cropper: ^12.2.1
  flutter_colorpicker: ^1.1.0
  flutter_zoom_drawer: ^3.2.0
  liquid_glass_widgets: 1.8.0
  palette_generator: ^0.3.3+7
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/guide_media/
    - assets/splash/
    - assets/icon/
    - assets/icon/app_icon.ico
    - assets/images/
    - assets/turnstile/
    - update_manifest.json
    - update_changelog_archive.json
